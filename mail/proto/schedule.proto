syntax = "proto3";

package schedule;
option go_package = "./proto;schedule";

service ScheduleService {
    rpc GetFaculties(Empty) returns (FacultiesResponse);
    rpc GetGroups(GroupsRequest) returns (GroupsResponse);
    rpc GetSchedule(ScheduleRequest) returns (ScheduleResponse);
    rpc GetLastUpdated(Empty) returns (LastUpdatedResponse);
    rpc GetScheduleByPath(SGUPathRequest) returns (ScheduleResponse);
    rpc RunScrape(Empty) returns (ScrapeResponse);
    rpc GetScrapeStatus(Empty) returns (ScrapeStatusResponse);
}

message Empty {}

message Faculty {
    int32 id = 1;
    string name = 2;
}

message Group {
    int32 id = 1;
    string name = 2;
    int32 faculty_id = 3;
    int32 edu_form_id = 4;
}

message ScheduleItem {
    int32 id = 1;
    int32 group_id = 2;
    int32 day_of_week = 3;
    string subject = 5;
    string teacher = 6;
    string room = 7;
    string start_time = 8;
    string end_time = 9;
    string mode = 10;
    int32 subgroup = 11;
}

message FacultiesResponse {
    repeated Faculty faculties = 1;
}

message GroupsRequest {
    int32 faculty_id = 1;
    int32 edu_form_id = 2;
}

message GroupsResponse {
    repeated Group groups = 1;
}

message ScheduleRequest {
    int32 group_id = 1;
}

message ScheduleResponse {
    repeated ScheduleItem schedule = 1;
}

message LastUpdatedResponse {
    map<string, string> updates = 1;
}

message SGUPathRequest {
    string faculty = 1;
    string form = 2;
    string group = 3;
}

message ScrapeResponse {
    bool success = 1;
}

message ScrapeStatusResponse {
    bool running = 1;
    string last_trigger = 2;
    string last_started_at = 3;
    string last_finished_at = 4;
    int64 last_duration_ms = 5;
    string last_error = 6;
}
